<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUJAL | SX⁷ - ADVANCED CONTROL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#0a0e14; color:#00ff88; font-family:'Courier New', monospace; overflow-x:hidden; }
        .header { 
            background:#161b22; 
            padding:25px; 
            text-align:center; 
            border-bottom:4px solid #00ff88; 
            font-size:32px; 
            animation: breathe 4s infinite ease-in-out;
            box-shadow: 0 0 30px #00ff88;
        }
        @keyframes breathe { 0%,100% { opacity:1; } 50% { opacity:0.85; } }

        .card { background:rgba(0,255,0,0.08); border:2px solid #00ff88; border-radius:15px; }
        input, textarea { background:#111; color:#00ff88; border:1px solid #00ff88; }
        
        .console { 
            height: 420px; 
            background:#000; 
            border:3px solid #ffcc00; 
            padding:18px; 
            overflow-y:auto; 
            font-size:15px; 
            line-height:1.6;
            color:#ffcc00; 
            box-shadow:0 0 25px #ffcc00;
        }
        
        .btn-start { 
            background:#00ff88; 
            color:#000; 
            font-weight:bold; 
            font-size:22px; 
            padding:15px; 
            box-shadow:0 0 30px #00ff88;
            transition:all 0.3s;
        }
        .btn-start:hover { transform:scale(1.05); box-shadow:0 0 50px #00ff88; }
        
        .btn-stop { 
            background:#ff3366; 
            color:white; 
            font-weight:bold; 
            font-size:22px; 
            padding:15px; 
        }
        
        .tab-content { display:none; }
        .tab-content.active { display:block; }
        .nav-link { color:#00ff88; border-bottom:3px solid transparent; }
        .nav-link.active { border-bottom:3px solid #ffcc00; color:#ffcc00; }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="header">✦ SUJAL | SX⁷ - ADVANCED SINGLE ACCOUNT ✦</div>

    <ul class="nav nav-tabs justify-content-center mt-4" id="tabs">
        <li class="nav-item"><a class="nav-link active" onclick="openTab(0)">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" onclick="openTab(1)">Configuration</a></li>
        <li class="nav-item"><a class="nav-link" onclick="openTab(2)">Breaks Settings</a></li>
        <li class="nav-item"><a class="nav-link" onclick="openTab(3)">Live Console</a></li>
    </ul>

    <!-- Dashboard Tab -->
    <div class="tab-content active" id="tab0">
        <div class="card p-4 text-center">
            <h4 class="mb-3">📊 CURRENT STATUS</h4>
            <span id="status" class="badge fs-3 px-5 py-3">STOPPED</span>
            <div class="mt-4 d-grid gap-3">
                <button onclick="startBomb()" class="btn btn-start">▶ START BOT</button>
                <button onclick="stopBomb()" class="btn btn-stop">⛔ STOP BOT</button>
            </div>
            <div class="mt-4">
                <small>Sent: <span id="sent" class="fw-bold">0</span> | Uptime: <span id="uptime">00:00:00</span></small>
            </div>
        </div>
    </div>

    <!-- Configuration Tab -->
    <div class="tab-content" id="tab1">
        <div class="card p-4">
            <form id="form">
                <div class="mb-3">
                    <label class="form-label">Session ID (Optional)</label>
                    <textarea name="sessionid" class="form-control" rows="2" placeholder="sessionid paste karo"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Thread ID (Specific GC) <span class="text-danger">*</span></label>
                    <input name="thread_id" type="text" class="form-control" placeholder="117390744240357" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Messages (1 per line)</label>
                    <textarea name="messages" class="form-control" rows="6" placeholder="Message 1\nMessage 2" required></textarea>
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Message Delay (sec)</label>
                        <input name="delay" type="number" step="0.1" class="form-control" value="25">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Group Name Base</label>
                        <input name="group_name" type="text" class="form-control" placeholder="SUJAL BAAP">
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Breaks Settings Tab -->
    <div class="tab-content" id="tab2">
        <div class="card p-4">
            <h4 class="mb-3 text-center">⏳ BREAKS SETTINGS</h4>
            <div class="mb-3">
                <label class="form-label">Messages ke baad break lena hai</label>
                <input name="cycle" type="number" class="form-control" value="35" min="5" max="200">
                <small class="text-muted">Example: 35 msgs ke baad break</small>
            </div>
            <div class="mb-3">
                <label class="form-label">Break kitne seconds ka hona hai (Max 60)</label>
                <input name="break_sec" type="number" class="form-control" value="40" min="10" max="60">
            </div>
        </div>
    </div>

    <!-- Live Console Tab -->
    <div class="tab-content" id="tab3">
        <div class="card p-4">
            <h4 class="mb-3 text-center">📜 LIVE CONSOLE (Yellow Eye-Catching)</h4>
            <div id="console" class="console"></div>
        </div>
    </div>
</div>

<script>
function openTab(n) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.getElementById('tab'+n).classList.add('active');
    document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-link')[n].classList.add('active');
}

function updateStatus() {
    fetch("/status").then(r => r.json()).then(d => {
        document.getElementById("sent").innerText = d.sent;
        document.getElementById("uptime").innerText = d.uptime;
        
        const statusEl = document.getElementById("status");
        if (d.running) {
            statusEl.innerText = "RUNNING";
            statusEl.className = "badge bg-danger fs-3 px-5 py-3 status-running";
        } else {
            statusEl.innerText = "STOPPED";
            statusEl.className = "badge bg-secondary fs-3 px-5 py-3";
        }

        const consoleDiv = document.getElementById("console");
        consoleDiv.innerHTML = d.logs.map(l => `<div>${l}</div>`).join("");
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
    });
}

function startBomb() {
    const form = document.getElementById("form");
    fetch("/start", { method: "POST", body: new FormData(form) })
        .then(() => updateStatus());
}

function stopBomb() {
    fetch("/stop", { method: "POST" }).then(() => updateStatus());
}

setInterval(updateStatus, 1200);
updateStatus();
</script>
</body>
</html>
